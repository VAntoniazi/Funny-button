name: Validate static project

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -s index.html
          test -s README.md
          test -s LICENSE
      - name: Check document contract
        run: |
          grep -q '<html lang="pt-BR">' index.html
          grep -q 'viewport' index.html
          grep -q 'pointerenter' index.html
          grep -q 'touchstart' index.html
