name: Pair collaboration

on:
  push:
    branches:
      - 'pair/**'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate branch-scoped collaboration note
        run: |
          mkdir -p automation
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          OUTPUT="automation/${SAFE_BRANCH}.md"
          {
            echo '# Automated collaboration'
            echo
            echo 'This file is generated by GitHub Actions from an explicitly triggered collaboration branch.'
            echo
            echo "Branch: $GITHUB_REF_NAME"
            echo "Source commit: $GITHUB_SHA"
          } > "$OUTPUT"

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: generate branch collaboration note" -m "Co-authored-by: Victor Antoniazi Gonzalez <99286703+VAntoniazi@users.noreply.github.com>"
          git push
