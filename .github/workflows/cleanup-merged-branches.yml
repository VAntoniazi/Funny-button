name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: remove merged work branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified, already-merged branch heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failures=0
          while read -r branch expected; do
            [ -n "$branch" ] || continue
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')" || {
              echo "::warning::Could not inspect branch $branch"
              failures=1
              continue
            }
            if [ "$actual" != "$expected" ]; then
              echo "::warning::Skipped changed branch $branch"
              failures=1
              continue
            fi
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent; then
              echo "Deleted verified branch $branch"
            else
              echo "::error::Failed to delete $branch"
              failures=1
            fi
          done <<'BRANCHES'
          chore/pair-collaboration-workflow 1d84f4630e88ae600c25afcacb53cbf395180e8e
          docs/project-readme 082b54d12fd051f9900ace96fcaf2e1a409491eb
          docs/public-project-polish 793eb1db01fbdfdc739652d81419ca9baffb1ee2
          fix/mobile-button-behavior 40a5acdf91bfdc362fa0427cecb2f712cb4865b5
          pair/accessibility-notes 2066e1c62e627c676c0a7c375cb62b306fb70728
          pair/architecture-doc 9a03ab8e642f1053335fbdc8d27a5cf9f82a3aef
          pair/automated-doc 68f4b645febadec1f5d8a056477c30a306242386
          pair/bug-template af5a0355f913fb485bab518e4e5b0638807c2d52
          pair/code-of-conduct 1b003a1ae432f0299e0c22e7746bb162e385a152
          pair/contributing-guide 367106b5964af1ebed18903d2a9ad29349e29f0d
          pair/editorconfig dfcc08a44bd776cc0542d1b7b0842fefd4e2c942
          pair/pr-template cda0f8ce05fd0f4b7c98bd578c26abe0c0862459
          pair/security-policy a17a44c21ece9c8c0f99ceec9806430598de2087
          pair/static-validation 93db933c099828853c57b4dee7f938e8f3611320
          pair/workflow-isolated-output 730768a98070979be5ee2bc590fbb9e676f49a1d
          BRANCHES
          exit "$failures"
