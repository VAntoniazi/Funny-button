<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ff">
  <meta name="description" content="Um convite para o cinema, dois botões e uma pequena surpresa. Um experimento divertido em HTML, CSS e JavaScript puro.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cineminha sexta? | Funny Button">
  <meta property="og:description" content="Uma pergunta simples. Um botão que não facilita a resposta.">
  <title>Cineminha sexta? | Funny Button</title>
  <style>
    :root {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #241a3f;
      background: #faf7ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 16% 12%, #f6dcff 0, transparent 33%),
        radial-gradient(circle at 90% 86%, #ffe8e4 0, transparent 30%),
        #faf7ff;
    }
    main { width: min(100%, 490px); }
    .card {
      padding: clamp(30px, 7vw, 54px) clamp(24px, 6vw, 48px);
      border: 1px solid #ece3f6;
      border-radius: 28px;
      background: rgba(255, 255, 255, .91);
      box-shadow: 0 22px 70px rgba(74, 37, 115, .10);
      text-align: center;
    }
    .sticker {
      display: inline-grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin-bottom: 23px;
      border-radius: 22px;
      background: #f6ebff;
      font-size: 38px;
      transform: rotate(-7deg);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #77519e;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 3rem);
      letter-spacing: -.055em;
      line-height: 1.12;
    }
    .subtitle {
      max-width: 31ch;
      margin: 19px auto 29px;
      color: #645873;
      font-size: 1rem;
      line-height: 1.65;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 56px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      min-height: 52px;
      padding: 13px 24px;
      border: 2px solid transparent;
      border-radius: 14px;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
    }
    .button:focus-visible {
      outline: 3px solid #b37cf6;
      outline-offset: 4px;
    }
    .yes {
      color: #fff;
      background: #7437bb;
      box-shadow: 0 8px 20px rgba(116, 55, 187, .2);
      transition: background-color .18s ease, transform .18s ease;
    }
    .yes:hover { background: #5d279e; transform: translateY(-2px); }
    .no { color: #5d427d; background: #f5effb; border-color: #e6d9f4; }
    .no.is-escaping { position: fixed; z-index: 10; margin: 0; }
    .hint { margin: 24px 0 0; color: #796d87; font-size: .85rem; }
    .feedback { min-height: 1.5em; margin: 12px 0 0; color: #5d279e; font-size: .9rem; font-weight: 600; }
    .footer { margin: 20px 0 0; color: #857b91; font-size: .78rem; text-align: center; }
    .footer a { color: inherit; text-underline-offset: 3px; }
    @media (max-width: 380px) {
      body { padding: 14px; }
      .card { padding: 32px 16px; }
      .actions { gap: 9px; }
      .button { min-width: 110px; padding-inline: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="question">
      <div class="sticker" aria-hidden="true">🍿</div>
      <p class="eyebrow">Um convite especial</p>
      <h1 id="question">Cineminha sexta?</h1>
      <p class="subtitle">Pipoca, filme e companhia boa. Só falta você escolher uma resposta.</p>
      <div class="actions">
        <a class="button yes" href="https://www.youtube.com/watch?v=thJ0sUR_sWg">Sim, vamos!</a>
        <button class="button no" id="no-button" type="button">Não</button>
      </div>
      <p class="hint">Dica: um dos botões é meio tímido.</p>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </section>
    <p class="footer">Um experimento de interação · <a href="https://github.com/VAntoniazi/Funny-button">Ver código</a></p>
  </main>
  <script>
    const noButton = document.getElementById('no-button');
    const feedback = document.getElementById('feedback');
    const padding = 12;
    let escaped = false;

    function bounds() {
      const view = window.visualViewport;
      const left = view ? view.offsetLeft : 0;
      const top = view ? view.offsetTop : 0;
      const width = view ? view.width : document.documentElement.clientWidth;
      const height = view ? view.height : window.innerHeight;
      const rect = noButton.getBoundingClientRect();
      return {
        minX: left + Math.min(padding, Math.max(0, width - rect.width)),
        minY: top + Math.min(padding, Math.max(0, height - rect.height)),
        maxX: left + Math.max(0, width - rect.width - padding),
        maxY: top + Math.max(0, height - rect.height - padding)
      };
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function escapeButton(pointerX, pointerY) {
      const area = bounds();
      let x = area.minX;
      let y = area.minY;
      // Avoid placing the button directly under the pointer.
      for (let attempt = 0; attempt < 24; attempt += 1) {
        x = area.minX + Math.random() * Math.max(0, area.maxX - area.minX);
        y = area.minY + Math.random() * Math.max(0, area.maxY - area.minY);
        if (Math.hypot(x - pointerX, y - pointerY) > 130) break;
      }
      noButton.classList.add('is-escaping');
      noButton.style.left = Math.round(x) + 'px';
      noButton.style.top = Math.round(y) + 'px';
      escaped = true;
    }

    noButton.addEventListener('pointerenter', (event) => {
      if (event.pointerType !== 'touch') escapeButton(event.clientX, event.clientY);
    });

    noButton.addEventListener('touchstart', (event) => {
      if (event.cancelable) event.preventDefault();
      const touch = event.touches[0];
      if (touch) escapeButton(touch.clientX, touch.clientY);
    }, { passive: false });

    noButton.addEventListener('click', () => {
      feedback.textContent = 'Tudo bem! O convite continua aberto.';
    });

    function keepOnScreen() {
      if (!escaped) return;
      const area = bounds();
      noButton.style.left = Math.round(clamp(parseFloat(noButton.style.left), area.minX, area.maxX)) + 'px';
      noButton.style.top = Math.round(clamp(parseFloat(noButton.style.top), area.minY, area.maxY)) + 'px';
    }

    window.addEventListener('resize', keepOnScreen);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', keepOnScreen);
      window.visualViewport.addEventListener('scroll', keepOnScreen);
    }
  </script>
</body>
</html>
